[project]
name = "rome-house-search"
version = "1.0.0"
description = "Cerca casa a Roma per budget e zona, stimando i costi di ristrutturazione"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
cerca-casa = "romasearch.cli:main"

[tool.setuptools]
packages = ["romasearch", "romasearch.scrapers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "ARG", "C4", "PL"]
ignore = [
    "PLR0913",  # i profili di selettori hanno molti campi per natura
    "PLR2004",  # i numeri magici sono qui sotto nome
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["romasearch"]